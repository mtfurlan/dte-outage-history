name: dte-outatge-history
services:
  postgres:
    # based on postgis/postgis with gdal-bin
    build:
        context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dte
    ports:
      - '5438:5432'
    volumes:
      - /scratch/dte-outage-history/raw_files:/data
      - .:/workdir
      - ./db/postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
